name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > android/app/release-keystore.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=${{ github.workspace }}/android/app/release-keystore.jks
          EOF

      - name: Pub get
        run: flutter pub get
      - name: Install Android SDK 36 and Build-Tools
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk anomalia.apk

      - name: Checksum
        run: sha256sum anomalia.apk > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo anomalia-io/anomalia-mobile \
            --title "Anomalia Mobile ${GITHUB_REF_NAME}" \
            --notes "- Anomalia Mobile: complemento móvil oficial para Android de la plataforma Anomalía.
            - Diseñado para la recepción y consulta en tiempo real de alertas enriquecidas por Inteligencia Artificial.
            - Características: Recepción de alertas, Notificaciones Push (FCM), configuración rápida por escaneo de QR y autenticación OIDC/SSO.
            - Archivos: anomalia.apk y checksums.txt." \
            anomalia.apk \
            checksums.txt
